name: CI

on:
  push:
    branches:
      - main
      - dev

env:
  MONGO_DB_NAME: gha-demo
  MONGODB_CLUSTER_ADDRESS: mongodb+srv://<db_username>:<db_password>@cluster0.ps0spdp.mongodb.net/?appName=Cluster0
  MONGODB_USERNAME: dheerajck
  MONGODB_PASSWORD: CmHyHv92M8wDKA8
  PORT: 8080

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run server
        run: |
          npm start &
          npx wait-on http://127.0.0.1:$PORT

      - name: Run tests
        run: npm test

      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "MONGODB_DB_NAME: $MONGO_DB_NAME"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "MONGODB_DB_NAME: $MONGO_DB_NAME"