name: CI

on:
  push:
    branches:
      - main
      - dev

env:
  MONGO_DB_NAME: gha-demo
  MONGODB_CLUSTER_ADDRESS: "@cluster0.x85crrq.mongodb.net"
  MONGODB_USERNAME: dheerajgowda460_db_user
  MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
  PORT: 8080

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Run server
        run: |
          npm start &
          npx wait-on http://127.0.0.1:$PORT

      - name: Run tests
        run: npm test

      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_DB_NAME: ${{ env.MONGO_DB_NAME }}"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
          echo "MONGODB_DB_NAME: ${{ env.MONGO_DB_NAME }}"